name: "Release"

on:
  workflow_dispatch:
    inputs:
      pre-release:
        description: "Is pre-release? A default version gets an `-rc` suffix; a custom version must include its own pre-release suffix, for example `1.0.0-rc.1`."
        type: boolean
        required: true
        default: true
      version:
        description: "Version; if blank, the current date is used"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: false

jobs:

  build-job:
    name: "Build"
    uses: "bottlenoselabs/sdk/.github/workflows/cs-build.yml@vBOTTLENOSELABS_SDK_VERSION"
    with:
      path: "./src/cs"
      # Set to true once the solution has test projects
      test: false

  release-job:
    name: "Release"
    needs: [build-job]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The NuGet.org trusted publishing policy names this file, release.yml, because the job that logs in is here
    permissions:
      contents: write # Create the tag and GitHub release
      id-token: write # NuGet trusted publishing (OIDC)
    steps:

      - name: "Release"
        uses: "bottlenoselabs/sdk/.github/actions/cs-release@vBOTTLENOSELABS_SDK_VERSION"
        with:
          path: "./src/cs"
          pre-release: ${{ inputs.pre-release }}
          version: ${{ inputs.version }}
          nuget-user: ${{ secrets.NUGET_USER }}
