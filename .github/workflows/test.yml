name: "Test SDK"

on:
  workflow_call:

permissions:
  contents: read

jobs:

  test-sdk-job:
    name: "Test SDK: ${{ matrix.platform.name }}"
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform:
        - { name: Windows, os: windows-latest }
        - { name: Linux, os: ubuntu-latest }
        - { name: macOS, os: macos-latest }
    defaults:
      run:
        shell: bash
    steps:

    - name: "Clone Git repository"
      uses: actions/checkout@v4

    - name: "Setup .NET"
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: "Build the SDK"
      run: dotnet build "./src/cs" --nologo --verbosity minimal --configuration Release

    - name: "Pack the SDK and build a consumer project against it"
      run: ./src/cs/tests/Consumer/test.sh
