# Reusable: publish a C# game with NativeAOT once per platform (runtime identifier), and upload each build as an artifact.
# NativeAOT can't compile for another operating system, so each runtime identifier runs on a runner of its operating system.
#
# Usage from another repository:
#
#   jobs:
#     publish:
#       uses: bottlenoselabs/sdk/.github/workflows/cs-game-publish.yml@<tag>
#       with:
#         project: ./src/cs/MyGame/MyGame.csproj
#         runtime-identifiers: '["win-x64", "win-arm64", "osx-arm64", "osx-x64", "linux-x64", "linux-arm64"]'
#
# Each artifact is named `<artifact-name>-<runtime identifier>` and holds one archive: `.zip` for Windows, `.tar.gz` otherwise.
# The archive keeps the executable permission on macOS and Linux, which uploading the folder directly would lose.

name: "C# game publish"

on:
  workflow_call:
    inputs:
      project:
        description: "Game project (.csproj) to publish"
        type: string
        required: true
      runtime-identifiers:
        description: "JSON array of runtime identifiers to publish for"
        type: string
        default: '["win-x64", "osx-arm64", "linux-x64"]'
      runners:
        description: "JSON object mapping runtime identifiers to runner labels, to override the defaults, for example `{\"linux-arm64\": \"my-arm-runner\"}`"
        type: string
        default: "{}"
      artifact-name:
        description: "Artifact name prefix; defaults to the project file name without extension"
        type: string
        default: ""
      version:
        description: "Version to stamp on the game; if blank, the SDK default is used"
        type: string
        default: ""
      submodules:
        description: "Clone Git submodules too (`true`, `false`, or `recursive`)"
        type: string
        default: "false"
      global-json-file:
        description: "global.json that pins the .NET SDK version"
        type: string
        default: "global.json"
      pre-publish-script:
        description: "Optional Bash commands to run before publishing, from the repository root"
        type: string
        default: ""
      retention-days:
        description: "Days to keep the uploaded artifacts"
        type: number
        default: 14

permissions:
  contents: read

jobs:

  matrix-job:
    name: "Plan"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      include: ${{ steps.plan.outputs.INCLUDE }}
    steps:

      - name: "Pick a runner per runtime identifier"
        id: plan
        shell: bash
        env:
          RUNTIME_IDENTIFIERS: ${{ inputs.runtime-identifiers }}
          RUNNERS: ${{ inputs.runners }}
        run: |
          # Default runners: Windows Arm64 cross-compiles on x64, macOS builds both architectures, Linux Arm64 needs an Arm runner
          INCLUDE="$(jq -c -n --argjson rids "$RUNTIME_IDENTIFIERS" --argjson overrides "$RUNNERS" '
            {
              "win-x64": "windows-latest",
              "win-arm64": "windows-latest",
              "osx-x64": "macos-latest",
              "osx-arm64": "macos-latest",
              "linux-x64": "ubuntu-latest",
              "linux-arm64": "ubuntu-24.04-arm"
            } as $defaults
            | [ $rids[] | { rid: ., os: ($overrides[.] // $defaults[.] // error("No runner for runtime identifier \(.); set one with the runners input")) } ]
          ')"
          echo "INCLUDE=$INCLUDE"
          echo "INCLUDE=$INCLUDE" >> "$GITHUB_OUTPUT"

  publish-job:
    name: "Publish: ${{ matrix.rid }}"
    needs: [matrix-job]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix-job.outputs.include) }}
    defaults:
      run:
        shell: bash
    steps:

      - name: "Clone Git repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: ${{ inputs.submodules }}

      - name: "Setup .NET"
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: ${{ inputs.global-json-file }}

      - name: "Run pre-publish script"
        if: ${{ inputs.pre-publish-script != '' }}
        env:
          SCRIPT: ${{ inputs.pre-publish-script }}
        run: bash -euo pipefail -c "$SCRIPT"

      - name: ".NET publish"
        env:
          PROJECT: ${{ inputs.project }}
          RID: ${{ matrix.rid }}
          VERSION: ${{ inputs.version }}
        run: |
          VERSION_ARGUMENTS=()
          if [[ -n "$VERSION" ]]; then
            VERSION_ARGUMENTS=(-p:Version="$VERSION")
          fi
          dotnet publish "$PROJECT" --nologo --verbosity minimal --configuration Release --runtime "$RID" \
            --output "$RUNNER_TEMP/publish/$RID" "${VERSION_ARGUMENTS[@]}"

      - name: "Archive"
        id: archive
        env:
          PROJECT: ${{ inputs.project }}
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
          RID: ${{ matrix.rid }}
        run: |
          NAME="${ARTIFACT_NAME:-$(basename "$PROJECT" .csproj)}-$RID"
          cd "$RUNNER_TEMP/publish/$RID"
          if [[ "$RID" == win-* ]]; then
            ARCHIVE="$RUNNER_TEMP/$NAME.zip"
            7z a -tzip -bso0 "$ARCHIVE" .
          else
            ARCHIVE="$RUNNER_TEMP/$NAME.tar.gz"
            tar -czf "$ARCHIVE" .
          fi
          echo "NAME=$NAME" >> "$GITHUB_OUTPUT"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: "Upload"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.archive.outputs.NAME }}
          path: ${{ steps.archive.outputs.ARCHIVE }}
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
