# Reusable: publish a C# game with NativeAOT once per platform (runtime identifier), and upload each build as an artifact.
# NativeAOT can't compile for another operating system, so each runtime identifier runs on a runner of its operating system.
#
# Usage from another repository:
#
#   jobs:
#     publish:
#       uses: bottlenoselabs/sdk/.github/workflows/cs-game-publish.yml@<tag>
#       with:
#         project: ./src/cs/MyGame/MyGame.csproj
#         runtime-identifiers: '["win-x64", "win-arm64", "osx-arm64", "osx-x64", "linux-x64", "linux-arm64"]'
#
# Each artifact is named `<artifact-name>-<runtime identifier>` and holds one archive: `.zip` for Windows, `.tar.gz` otherwise.
# With bottlenoselabs.Sdk.GameApp the archive holds <name>.exe (Windows), <name>.app (macOS), or one <name>.AppImage file (Linux).
# The archive keeps the executable permission on macOS and Linux, which uploading the folder directly would lose.

name: "C# game publish"

on:
  workflow_call:
    inputs:
      project:
        description: "Game project (.csproj) to publish"
        type: string
        required: true
      runtime-identifiers:
        description: "JSON array of runtime identifiers to publish for"
        type: string
        default: '["win-x64", "osx-arm64", "linux-x64"]'
      runners:
        description: "JSON object mapping runtime identifiers to runner labels, to override the defaults, for example `{\"linux-arm64\": \"my-arm-runner\"}`"
        type: string
        default: "{}"
      artifact-name:
        description: "Artifact name prefix; defaults to the project file name without extension"
        type: string
        default: ""
      version:
        description: "Version to stamp on the game; if blank, the SDK default is used"
        type: string
        default: ""
      submodules:
        description: "Clone Git submodules too (`true`, `false`, or `recursive`)"
        type: string
        default: "false"
      global-json-file:
        description: "global.json that pins the .NET SDK version"
        type: string
        default: "global.json"
      pre-publish-script:
        description: "Optional Bash commands to run before publishing, from the repository root"
        type: string
        default: ""
      retention-days:
        description: "Days to keep the uploaded artifacts"
        type: number
        default: 14

permissions:
  contents: read

jobs:

  matrix-job:
    name: "Plan"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      include: ${{ steps.plan.outputs.INCLUDE }}
    steps:

      - name: "Pick a runner per runtime identifier"
        id: plan
        shell: bash
        env:
          RUNTIME_IDENTIFIERS: ${{ inputs.runtime-identifiers }}
          RUNNERS: ${{ inputs.runners }}
        run: |
          # Default runners: Windows Arm64 cross-compiles on x64, macOS builds both architectures, Linux Arm64 needs an Arm runner
          INCLUDE="$(jq -c -n --argjson rids "$RUNTIME_IDENTIFIERS" --argjson overrides "$RUNNERS" '
            {
              "win-x64": "windows-latest",
              "win-arm64": "windows-latest",
              "osx-x64": "macos-latest",
              "osx-arm64": "macos-latest",
              "linux-x64": "ubuntu-latest",
              "linux-arm64": "ubuntu-24.04-arm"
            } as $defaults
            | [ $rids[] | { rid: ., os: ($overrides[.] // $defaults[.] // error("No runner for runtime identifier \(.); set one with the runners input")) } ]
          ')"
          echo "INCLUDE=$INCLUDE"
          echo "INCLUDE=$INCLUDE" >> "$GITHUB_OUTPUT"

  publish-job:
    name: "Publish: ${{ matrix.rid }}"
    needs: [matrix-job]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix-job.outputs.include) }}
    defaults:
      run:
        shell: bash
    steps:

      - name: "Clone Git repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: ${{ inputs.submodules }}

      - name: "Setup .NET"
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: ${{ inputs.global-json-file }}

      - name: "Run pre-publish script"
        if: ${{ inputs.pre-publish-script != '' }}
        env:
          SCRIPT: ${{ inputs.pre-publish-script }}
        run: bash -euo pipefail -c "$SCRIPT"

      - name: ".NET publish"
        env:
          PROJECT: ${{ inputs.project }}
          RID: ${{ matrix.rid }}
          VERSION: ${{ inputs.version }}
        run: |
          VERSION_ARGUMENTS=()
          if [[ -n "$VERSION" ]]; then
            VERSION_ARGUMENTS=(-p:Version="$VERSION")
          fi
          dotnet publish "$PROJECT" --nologo --verbosity minimal --configuration Release --runtime "$RID" \
            --output "$RUNNER_TEMP/publish/$RID" "${VERSION_ARGUMENTS[@]}"

      - name: "AppImage"
        # bottlenoselabs.Sdk.GameApp publishes <name>.AppDir on Linux; turn it into one <name>.AppImage file that runs on most distributions
        if: ${{ startsWith(matrix.rid, 'linux-') }}
        env:
          RID: ${{ matrix.rid }}
        run: |
          # Pinned releases, checked against their SHA-256 digests: appimagetool 1.9.1 and the AppImage type 2 runtime 20251108
          case "$RID" in
            linux-x64)
              ARCH="x86_64"
              TOOL_SHA256="ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
              RUNTIME_SHA256="2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d"
              ;;
            linux-arm64)
              ARCH="aarch64"
              TOOL_SHA256="f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158"
              RUNTIME_SHA256="00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444"
              ;;
            *)
              echo "No AppImage tools for $RID" >&2
              exit 1
              ;;
          esac
          TOOL="$RUNNER_TEMP/appimagetool"
          RUNTIME="$RUNNER_TEMP/appimage-runtime"
          curl --fail --silent --show-error --location --output "$TOOL" "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-$ARCH.AppImage"
          curl --fail --silent --show-error --location --output "$RUNTIME" "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-$ARCH"
          echo "$TOOL_SHA256  $TOOL" | sha256sum --check --strict
          echo "$RUNTIME_SHA256  $RUNTIME" | sha256sum --check --strict
          chmod +x "$TOOL"

          cd "$RUNNER_TEMP/publish/$RID"
          APPDIR="$(find . -mindepth 1 -maxdepth 1 -name "*.AppDir" | head -n 1)"
          if [[ -z "$APPDIR" ]]; then
            echo "No .AppDir in the publish folder; is IsEnabledPlatformPackaging off?" >&2
            exit 1
          fi
          NAME="$(basename "$APPDIR" .AppDir)"
          # Extract-and-run: runners have no FUSE to mount appimagetool itself
          ARCH="$ARCH" "$TOOL" --appimage-extract-and-run --no-appstream --runtime-file "$RUNTIME" "$APPDIR" "$NAME.AppImage"
          rm -rf "$APPDIR"

      - name: "Archive"
        id: archive
        env:
          PROJECT: ${{ inputs.project }}
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
          RID: ${{ matrix.rid }}
        run: |
          NAME="${ARTIFACT_NAME:-$(basename "$PROJECT" .csproj)}-$RID"
          cd "$RUNNER_TEMP/publish/$RID"
          if [[ "$RID" == win-* ]]; then
            ARCHIVE="$RUNNER_TEMP/$NAME.zip"
            7z a -tzip -bso0 "$ARCHIVE" .
          else
            ARCHIVE="$RUNNER_TEMP/$NAME.tar.gz"
            tar -czf "$ARCHIVE" .
          fi
          echo "NAME=$NAME" >> "$GITHUB_OUTPUT"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: "Upload"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.archive.outputs.NAME }}
          path: ${{ steps.archive.outputs.ARCHIVE }}
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
