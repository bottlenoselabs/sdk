# Regenerates the SDL C# bindings from the ext/SDL headers and fails if they differ from the committed ones, so the bindings always
# match the SDL release that's built and shipped. When they differ, the regenerated files are uploaded as the `sdl-bindings`
# artifact: download it and commit it to src/cs/production/SDL.Interop/Generated/.
#
# Extraction reads the C headers with clang for each platform, and each operating system can only extract its own targets.

name: "SDL bindings"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "bindgen/SDL/**"
      - "ext/SDL"
      - "dotnet-tools.json"
      - "src/bash/host-rid.sh"
      - "src/cs/production/SDL.Interop/Generated/**"
      - ".github/workflows/sdl-bindgen.yml"
  push:
    branches:
      - "main"
    paths:
      - "bindgen/SDL/**"
      - "ext/SDL"
      - "dotnet-tools.json"

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  extract-job:
    name: "Extract: ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04, not ubuntu-latest: c2ffi only finds libclang from LLVM 10 to 18, and newer Ubuntu releases ship newer LLVM
        os: [windows-latest, macos-latest, ubuntu-24.04]
    defaults:
      run:
        shell: bash
    steps:

      - name: "Clone Git repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Clone SDL"
        run: git submodule update --init --depth 1 ext/SDL

      - name: "Setup .NET"
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: "Install Linux dependencies"
        if: ${{ runner.os == 'Linux' }}
        # libclang for c2ffi (found at /usr/lib/llvm-18/lib/libclang.so.1), and the Arm64 C library headers for the
        # aarch64-unknown-linux-gnu target
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libclang1-18 gcc-aarch64-linux-gnu

      - name: "Extract"
        run: ./bindgen/SDL/bindgen.sh extract

      - name: "Upload"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "sdl-ffi-${{ runner.os }}"
          path: "bindgen/SDL/ffi"
          if-no-files-found: error

  generate-job:
    name: "Generate and compare"
    needs: [extract-job]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:

      - name: "Clone Git repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Setup .NET"
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: "Download extractions"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "sdl-ffi-*"
          path: "bindgen/SDL/ffi"
          merge-multiple: true

      - name: "Merge"
        run: ./bindgen/SDL/bindgen.sh merge

      - name: "Generate"
        run: ./bindgen/SDL/bindgen.sh generate

      - name: "Upload bindings"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "sdl-bindings"
          path: |
            src/cs/production/SDL.Interop/Generated
            bindgen/SDL/ffi-x
          if-no-files-found: error

      - name: "Compare with the committed bindings"
        run: |
          git add --intent-to-add src/cs/production/SDL.Interop/Generated
          if ! git diff --exit-code --stat -- src/cs/production/SDL.Interop/Generated; then
            echo "::error::The committed SDL bindings differ from the ones generated from ext/SDL. Download the sdl-bindings artifact of this run and commit its src/cs/production/SDL.Interop/Generated."
            exit 1
          fi
