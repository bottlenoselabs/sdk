name: "Release"

on:
  workflow_dispatch:
    inputs:
      pre-release:
        description: 'Is pre-release? (NOTE: A default version gets an `-rc` suffix; a custom version must include its own pre-release suffix, for example `1.0.0-rc.1`.)'
        type: boolean
        required: true
        default: true
      version:
        description: 'Version (NOTE: If left blank, the current date is used as the version.)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: false

jobs:

  build-job:
    name: "Build"
    uses: "./.github/workflows/cs-build.yml"
    with:
      path: "./src/cs"
      test: false
      script: "./src/cs/tests/Consumers/test.sh"

  release-job:
    name: "Release"
    needs: [build-job]
    uses: "./.github/workflows/cs-release.yml"
    permissions:
      contents: write
      id-token: write
    with:
      path: "./src/cs"
      pre-release: ${{ inputs.pre-release }}
      version: ${{ inputs.version }}
    secrets:
      NUGET_USER: ${{ secrets.NUGET_USER }}
