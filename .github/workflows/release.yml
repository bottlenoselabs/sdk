name: "Release"

on:
  workflow_dispatch:
    inputs:
      pre-release:
        description: 'Is pre-release? (NOTE: A default version gets an `-rc` suffix; a custom version must include its own pre-release suffix, for example `1.0.0-rc.1`.)'
        type: boolean
        required: true
        default: true
      version:
        description: 'Version (NOTE: If left blank, the current date is used as the version.)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: false

jobs:

  test-job:
    name: "Test SDK"
    uses: "./.github/workflows/test.yml"

  release-job:
    name: "Release"
    needs: [test-job]
    uses: "bottlenoselabs/.github/.github/workflows/release-nuget.yml@5ccd4dd015843eb598fa9f6a5ea5703ce974f28b" # main
    permissions:
      contents: write
      id-token: write
    with:
      pre-release: ${{ inputs.pre-release }}
      version: ${{ inputs.version }}
    secrets:
      NUGET_USER: ${{ secrets.NUGET_USER }}
