name: "Release"

on:
  workflow_dispatch:
    inputs:
      pre-release:
        description: 'Is pre-release? (NOTE: A default version gets an `-rc` suffix; a custom version must include its own pre-release suffix, for example `1.0.0-rc.1`.)'
        type: boolean
        required: true
        default: true
      version:
        description: 'Version (NOTE: If left blank, the current date is used as the version.)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: false

jobs:

  build-job:
    name: "Build"
    uses: "./.github/workflows/cs-build.yml"
    with:
      path: "./src/cs"
      test: false
      script: "./src/cs/tests/Consumers/test.sh"

  release-job:
    name: "Release"
    needs: [build-job]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The job is in this file, so the NuGet.org trusted publishing policy names `release.yml`
    permissions:
      contents: write # Create the tag and GitHub release
      id-token: write # NuGet trusted publishing (OIDC)
    steps:

      - name: "Clone Git repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Release"
        uses: "./.github/actions/cs-release"
        with:
          path: "./src/cs"
          pre-release: ${{ inputs.pre-release }}
          version: ${{ inputs.version }}
          nuget-user: ${{ secrets.NUGET_USER }}
