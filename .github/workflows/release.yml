name: "Release"

on:
  workflow_dispatch:
    inputs:
      pre-release:
        description: 'Is pre-release? (NOTE: Pre-releases are uploaded to MyGet.org instead of NuGet.org.)'
        type: boolean
        required: true
        default: true
      version:
        description: 'Version (NOTE: If left blank, the current date is used as the version.)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: false

jobs:

  test-job:
    name: "Test SDK"
    uses: "./.github/workflows/test.yml"

  pack-job:
    name: "Pack"
    needs: [test-job]
    # Only stable releases are restricted to the main branch
    if: ${{ inputs.pre-release || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.set-version.outputs.VERSION }}
    steps:

      - name: "Clone Git repository"
        uses: actions/checkout@v4

      - name: "Setup .NET"
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: "Set version"
        id: set-version
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
          IS_PRERELEASE: ${{ inputs.pre-release }}
        run: |
          VERSION="$VERSION_INPUT"
          if [[ -z "$VERSION" ]]; then
            # Date without zero padding so the Git tag matches the version NuGet normalizes to
            VERSION="$(date +'%Y.%-m.%-d')"
            if [[ "$IS_PRERELEASE" = "true" ]]; then
              VERSION="$VERSION-rc"
            fi
          fi

          echo "VERSION=$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: ".NET pack"
        env:
          VERSION: ${{ steps.set-version.outputs.VERSION }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: dotnet pack "./src/cs" --nologo --verbosity minimal --configuration Release -p:PackageVersion="$VERSION" -p:RepositoryBranch="$BRANCH" -p:RepositoryCommit="${{ github.sha }}"

      - name: "Upload packages as artifact"
        uses: actions/upload-artifact@v4
        with:
          name: "nupkg"
          path: "./nupkg/**/*.nupkg"
          if-no-files-found: error

  publish-myget-job:
    name: "Publish to MyGet"
    needs: [pack-job]
    if: ${{ inputs.pre-release }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:

      - name: "Clone Git repository"
        uses: actions/checkout@v4

      - name: "Setup .NET"
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: "Download packages"
        uses: actions/download-artifact@v4
        with:
          name: "nupkg"
          path: "./nupkg"

      - name: "Upload packages to MyGet"
        env:
          MYGET_ACCESS_TOKEN: ${{ secrets.MYGET_ACCESS_TOKEN }}
        run: dotnet nuget push "./nupkg/**/*.nupkg" --source https://www.myget.org/F/bottlenoselabs/api/v3/index.json --skip-duplicate --api-key "$MYGET_ACCESS_TOKEN"

  publish-nuget-job:
    name: "Publish to NuGet and create GitHub release"
    needs: [pack-job]
    if: ${{ !inputs.pre-release }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write # Required for NuGet trusted publishing (OIDC)
    steps:

      - name: "Clone Git repository"
        uses: actions/checkout@v4

      - name: "Setup .NET"
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: "Download packages"
        uses: actions/download-artifact@v4
        with:
          name: "nupkg"
          path: "./nupkg"

      - name: "Login to NuGet (trusted publishing)"
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: "Upload packages to NuGet"
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "./nupkg/**/*.nupkg" --source https://api.nuget.org/v3/index.json --skip-duplicate --api-key "$NUGET_API_KEY"

      - name: "Create tag and GitHub release"
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: "v${{ needs.pack-job.outputs.version }}"
          target_commitish: ${{ github.sha }}
