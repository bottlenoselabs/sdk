# Reusable: pack NuGet packages, push them to NuGet.org with trusted publishing, and create a tagged GitHub release.
# Only runs from the default branch, because NuGet.org packages are permanent.
#
# Usage from another repository (the calling job must grant these permissions):
#
#   jobs:
#     release:
#       uses: bottlenoselabs/sdk/.github/workflows/cs-release.yml@<tag>
#       permissions:
#         contents: write
#         id-token: write
#       with:
#         path: ./src/cs
#         pre-release: ${{ inputs.pre-release }}
#         version: ${{ inputs.version }}
#       secrets:
#         NUGET_USER: ${{ secrets.NUGET_USER }}

name: "C# release"

on:
  workflow_call:
    inputs:
      path:
        description: "Solution, project, or directory to pack"
        type: string
        default: "."
      global-json-file:
        description: "global.json that pins the .NET SDK version"
        type: string
        default: "global.json"
      pre-release:
        description: "Is pre-release? A default version gets an `-rc` suffix; a custom version must include its own pre-release suffix, for example `1.0.0-rc.1`."
        type: boolean
        default: true
      version:
        description: "Version; if blank, the current date is used, for example `2026.11.27`"
        type: string
        default: ""
    secrets:
      NUGET_USER:
        description: "NuGet.org user name that owns the trusted publishing policy"
        required: true
    outputs:
      version:
        description: "The released version"
        value: ${{ jobs.pack-job.outputs.version }}

permissions:
  contents: read

jobs:

  pack-job:
    name: "Pack"
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.set-version.outputs.VERSION }}
    steps:

      - name: "Clone Git repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Setup .NET"
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: ${{ inputs.global-json-file }}

      - name: "Set version"
        id: set-version
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
          IS_PRERELEASE: ${{ inputs.pre-release }}
        run: |
          VERSION="$VERSION_INPUT"
          if [[ -z "$VERSION" ]]; then
            # Date without zero padding so the Git tag matches the version NuGet normalizes to
            VERSION="$(date +'%Y.%-m.%-d')"
            if [[ "$IS_PRERELEASE" = "true" ]]; then
              VERSION="$VERSION-rc"
            fi
          fi

          echo "VERSION=$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: ".NET pack"
        env:
          PACK_PATH: ${{ inputs.path }}
          VERSION: ${{ steps.set-version.outputs.VERSION }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: dotnet pack "$PACK_PATH" --nologo --verbosity minimal --configuration Release -p:PackageVersion="$VERSION" -p:RepositoryBranch="$BRANCH" -p:RepositoryCommit="$COMMIT"

      - name: "Upload packages as artifact"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "nupkg"
          path: "./nupkg/**/*.nupkg"
          if-no-files-found: error

  publish-job:
    name: "Publish to NuGet and create GitHub release"
    needs: [pack-job]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Create the tag and GitHub release
      id-token: write # NuGet trusted publishing (OIDC)
    steps:

      - name: "Clone Git repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Setup .NET"
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: ${{ inputs.global-json-file }}

      - name: "Download packages"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: "nupkg"
          path: "./nupkg"

      - name: "Login to NuGet (trusted publishing)"
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: "Upload packages to NuGet"
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "./nupkg/**/*.nupkg" --source https://api.nuget.org/v3/index.json --skip-duplicate --api-key "$NUGET_API_KEY"

      - name: "Create tag and GitHub release"
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          prerelease: ${{ inputs.pre-release }}
          tag_name: "v${{ needs.pack-job.outputs.version }}"
          target_commitish: ${{ github.sha }}
