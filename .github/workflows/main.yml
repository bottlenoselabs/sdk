name: "Main"

on:
  workflow_dispatch:
  pull_request:
    types: [assigned, opened, synchronize, reopened]
  push:
    branches:
      - "main"

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  build-job:
    name: "Build"
    uses: "./.github/workflows/cs-build.yml"
    with:
      path: "./src/cs"
      # No test projects; the consumer script packs the SDK and checks it
      test: false
      script: "./src/cs/tests/Consumers/test.sh"
