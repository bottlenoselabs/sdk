name: "Main"

on:
  workflow_dispatch:
  pull_request:
    types: [assigned, opened, synchronize, reopened]
  push:
    branches:
      - "main"

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  build-job:
    name: "Build"
    uses: "./.github/workflows/cs-build.yml"
    with:
      path: "./src/cs"
      # No test projects; the consumer script packs the SDK and checks it
      test: false
      script: "./src/cs/tests/Consumers/test.sh"

  game-publish-job:
    name: "Game publish"
    uses: "./.github/workflows/cs-game-publish.yml"
    with:
      project: "./src/cs/tests/Consumers/GameApp/GameApp.csproj"
      # The game consumer uses the SDK from the local folder feed, so pack it first
      pre-publish-script: "dotnet pack ./src/cs --nologo --verbosity minimal --configuration Release"
      retention-days: 1

  game-publish-check-job:
    name: "Game publish: run the Linux AppImage"
    needs: [game-publish-job]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:

      - name: "Download"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: "GameApp-linux-x64"
          path: "./download"

      - name: "Run"
        shell: bash
        run: |
          mkdir game && tar -xzf ./download/GameApp-linux-x64.tar.gz -C game
          ls -la game
          # The test game only prints a line, so it runs without a display; no FUSE on runners, so extract and run
          ./game/GameApp.AppImage --appimage-extract-and-run

  release-dry-run-job:
    name: "Release (dry run)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:

      - name: "Clone Git repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Pack with the release action, without pushing"
        id: release
        uses: "./.github/actions/cs-release"
        with:
          path: "./src/cs"
          push: "false"

      - name: "Check the packages"
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          for id in bottlenoselabs.Sdk bottlenoselabs.Sdk.WebApp bottlenoselabs.Sdk.GameApp bottlenoselabs.Templates; do
            test -f "./nupkg/$id.$VERSION.nupkg" || { echo "Missing ./nupkg/$id.$VERSION.nupkg" >&2; exit 1; }
          done
